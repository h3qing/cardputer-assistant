; Cardputer Assistant firmware (cpa-fw). Layout and envs: docs/05-architecture.md §3.
; Toolchain: docs/adr/0001-toolchain.md chose A = espressif32@6.10.0
; (Arduino 2.0.17 / ESP-IDF 4.4.7 / GCC 8.4) with -std=gnu++17.
;
; Pure libraries (lib/core, protocol, link, outbox, input, storage) never include Arduino,
; M5 or esp_* headers and are unit-tested on the host:  pio test -e native -f 'core/*'
; Storage (docs/09-m2-design.md §3-4): partitions/cpa_8MB.csv labels the LittleFS
; partition cpafs; the SD card uses the patched SD library in ../third_party/SD.

[platformio]
default_envs = cardputer-adv

[common]
lib_deps_board =
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    ; M5Cardputer depends on "IRremote": pinned to the owner/version it resolved to,
    ; which silences the ambiguous-name warning and keeps the build reproducible.
    z3t0/IRremote@4.7.1
lib_deps_core = bblanchon/ArduinoJson@7.4.3
; 64-bit integers for epoch_ms / wall_ms on both targets.
json_flags = -DARDUINOJSON_USE_LONG_LONG=1

[env:cardputer-adv]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions/cpa_8MB.csv
; M5Cardputer declares IRremote (kept pinned above for a reproducible fetch); its IRremote.hpp pulls in
; GPL-3.0 headers and nothing here uses IR, so it is never compiled or linked.
lib_ignore = IRremote
board_build.filesystem = littlefs
build_unflags = -std=gnu++11
; -fstack-usage feeds the stack gate (16 KB loop stack, 05 §5.13): a lib frame or
; call chain over budget fails the build after linking.
build_flags =
    -std=gnu++17 -Wall -Wextra -fstack-usage
    -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DCORE_DEBUG_LEVEL=0
    ${common.json_flags}
; pre_upload: `cpa pause 120` when cpa exists, so the daemon lets go of the port
; (never shortening a longer pause already set).
; stack_gate (WP2: pure libs) and stack_budget (WP4: setup/loop/shell/hal chains).
extra_scripts =
    pre:scripts/pre_upload.py
    post:test/core/support/stack_gate.py
    post:scripts/stack_budget.py
; ../third_party holds the patched SD library (third_party/SD/README.md); PlatformIO
; searches it before the core's own SD.
lib_extra_dirs =
    modules
    ../third_party
; Static analysis (06 WP4): only readability-function-size (50 lines, nesting 4),
; promoted to errors in .clang-tidy so `--fail-on-defect high` fails on them.
check_tool = clangtidy
check_skip_packages = yes
check_src_filters = +<src/> +<lib/> +<modules/>
; --skip-packages also hides the toolchain's C++ library, which turns every TU into a
; fatal "cstdint not found": the libstdc++ / newlib headers are passed explicitly.
check_flags =
    clangtidy: --config-file=.clang-tidy --extra-arg-before=-xc++ --extra-arg-before=--target=arm-none-eabi --extra-arg=-std=gnu++17
    --extra-arg=-isystem${platformio.packages_dir}/toolchain-xtensa-esp32s3/xtensa-esp32s3-elf/include/c++/8.4.0
    --extra-arg=-isystem${platformio.packages_dir}/toolchain-xtensa-esp32s3/xtensa-esp32s3-elf/include/c++/8.4.0/xtensa-esp32s3-elf
    --extra-arg=-isystem${platformio.packages_dir}/toolchain-xtensa-esp32s3/lib/gcc/xtensa-esp32s3-elf/8.4.0/include
    --extra-arg=-isystem${platformio.packages_dir}/toolchain-xtensa-esp32s3/xtensa-esp32s3-elf/include
; Device tests run here; core/ and ui/ are host suites.
test_ignore = core/* ui/*
; one package per line: on a single line PlatformIO would glue the last two together
lib_deps =
    ${common.lib_deps_board}
    ${common.lib_deps_core}

; HIL build with debug.* hooks (docs/05 §9.3).
[env:cardputer-adv-test]
extends = env:cardputer-adv
build_flags = ${env:cardputer-adv.build_flags} -DCPA_TEST_HOOKS=1
; The device suites include hal/ and shell/ from test sources, whose own dependencies
; the chain-mode finder does not follow: the local libraries are listed explicitly.
lib_deps =
    ${env:cardputer-adv.lib_deps}
    core
    input
    link
    outbox
    protocol
    module_api
    theme
    shell
    hal
    storage
    usb_transport
    rec
    help
    i18n
    board
    home
    inbox
    system
    eggs
; The device suites are read by scripts/device_test_host.py, not by PlatformIO's own
; serial reader: it opens the port the safe way (03 §2: RTS/DTR never (1,0)), nudges
; parked TX (ADR-0001 §5.2) and plays the host side of the 8 KB RX burst test.
test_testing_command =
    uv
    run
    --no-project
    --with
    pyserial==3.5
    python
    scripts/device_test_host.py

; HIL build without the SD card (09 §3.9): hal_sd_mount reports Disabled without touching
; the bus, so the internal cpafs is the primary store as in v0.1. Also the fallback
; switch for a release should the power-loss gate show a loss on SD.
[env:cardputer-adv-test-nosd]
extends = env:cardputer-adv-test
build_flags = ${env:cardputer-adv-test.build_flags} -DCPA_STORAGE_NO_SD=1

[env:native]
platform = native
test_framework = unity
lib_extra_dirs = modules
lib_ignore = hal, usb_transport
; outbox is listed so the chain-mode finder scans it in full: it scans every library
; found by an include, but one found only during that scan (outbox, reached from
; storage's sd_store.h -> file_store.h) would build without its own core / protocol.
; rec (v0.3) likewise: test support headers include it before any library does, and
; theme (v0.5): FakeCanvas measures the big digits with it.
lib_deps =
    ${common.lib_deps_core}
    outbox
    rec
    theme
extra_scripts = pre:test/core/support/coverage_link.py
test_ignore = device/*
; CPA_TEST_HOOKS=1 so the codec knows debug.* and the contract vectors cover them.
build_flags =
    -std=c++17 -Wall -Wextra -Werror --coverage
    -DCPA_TEST_HOOKS=1
    ${common.json_flags}
    '-DCPA_PROTOCOL_DIR="${PROJECT_DIR}/../../protocol"'
