; Hardware probe firmware for the Cardputer ADV:
; two-way USB serial (NDJSON), raw key-combo logging, mic / speaker / SD tests.
;
; Toolchain A (baseline): Arduino core 2.0.17 (ESP-IDF 4.4.7). ESP-IDF 5.5 based
; cores record silence from the ADV mic (ESP-IDF #18621, open as of 2026-10-19).
; Toolchain B (G2 candidate): pioarduino 54.03.21-2 = Arduino 3.2.1 / ESP-IDF 5.4.2,
; pinned to its release zip. Decision and measurements: docs/adr/0001-toolchain.md.
; ../third_party/SD is a patched copy of core 2.0.17's SD library, shared with the app
; (third_party/SD/README.md); toolchain A uses it instead of the core's own, with the
; 25 MHz clock cap lifted (CPA_SD_UNCAPPED_CLOCK) for the clock sweep. SD bring-up:
; docs/gates/sd-card.md, host/sd_run.py.

[platformio]
; `pio run` builds the firmware envs only; env:native is for `pio test -e native`.
default_envs = cardputer-adv, cardputer-adv-gnu17, cardputer-adv-p54

[common]
lib_deps_board =
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
build_flags_usb =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

[env:cardputer-adv]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags_usb} -DCPA_SD_UNCAPPED_CLOCK
lib_deps = ${common.lib_deps_board}
lib_extra_dirs = ../third_party

; G2 compile check only: toolchain A with the app's C++ standard (05 §3).
[env:cardputer-adv-gnu17]
extends = env:cardputer-adv
build_unflags = -std=gnu++11
build_flags = ${env:cardputer-adv.build_flags} -std=gnu++17

[env:cardputer-adv-p54]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags_usb}
lib_deps = ${common.lib_deps_board}

; Host tests for lib/gate_core, the pure logic of the M3 gate commands (!xfer, !cue,
; !mic; docs/gates/m3-device-gates.md):  pio test -e native
; -std=c++11 matches env:cardputer-adv (core default gnu++11).
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Wall -Wextra -Werror --coverage
extra_scripts = pre:scripts/coverage_link.py
