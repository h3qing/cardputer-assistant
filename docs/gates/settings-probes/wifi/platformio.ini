; WiFi link-cost probes for docs/21 §5.3 (compile only; never flashed). Same toolchain and USB
; CDC options as firmware/app: espressif32@6.10.0, Arduino 2.0.17, IDF 4.4.7.
;
;   pio run -d docs/gates/settings-probes/wifi
;   NM=~/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-nm
;   for e in base scan idf ard; do $NM .pio/build/$e/firmware.elf | grep ' _heap_start$'; done
;   ls -l .pio/build/*/firmware.bin
;   python3 -I mapsum.py .pio/build/base/firmware.map .pio/build/scan/firmware.map
;     (where the bytes go; the Arduino build writes firmware.map by default)
;
; Boot heap starts at _heap_start (S3: IRAM and DRAM share one SRAM, so a larger IRAM or
; static area moves it up). Results on 2026-10-22:
;   env    _heap_start  boot heap vs base   firmware.bin
;   base   0x3fc96810   -                   257,632 B
;   scan   0x3fc9e3e8   -31,704 B           615,696 B   (passive scan, no netif)
;   idf    0x3fc9ee30   -34,336 B           644,576 B   (scan + connect + SNTP, direct IDF)
;   ard    0x3fc9f030   -34,848 B           684,432 B   (the same through Arduino WiFi.h)
; These are link costs only. What WiFi takes while it runs was not measured: G-WIFI #4 in
; docs/21 §5.8 is the device probe for that (init, scan, deinit, 50 cycles).

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -DCORE_DEBUG_LEVEL=0

[env:base]
build_src_filter = +<base.cpp>

[env:idf]
build_src_filter = +<idf.cpp>

[env:ard]
build_src_filter = +<ard.cpp>

[env:scan]
build_src_filter = +<scan.cpp>
