; Host simulator (gh #32): the firmware's pure runtime on macOS / Linux. It builds
; ../app/lib (except hal and usb_transport), ../app/modules and ../app/src/module_list.cpp
; unchanged, with the native test rig's fakes for the ports, and draws into a 240 x 135
; palette_8bit frame buffer with the device's font (efontCN_12 from M5GFX) and colours.
;   pio test -d firmware/sim                 the simulator's own tests
;   pio run -d firmware/sim                  builds .pio/build/sim/cpa-sim
; README.md has the script format and the commands.

[platformio]
default_envs = sim

[env:sim]
platform = native
test_framework = unity
lib_extra_dirs =
    ../app/lib
    ../app/modules
lib_ignore = hal, usb_transport
; Every firmware library is listed: the fakes come in through -I, which PlatformIO's
; chain-mode finder does not follow (see the native env in ../app/platformio.ini).
; app_modules compiles ../app/src/module_list.cpp (the device's module list);
; efont_cn12 is the font array gen_font.py copies out of M5GFX.
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    core
    i18n
    input
    link
    outbox
    protocol
    module_api
    theme
    eggs
    shell
    storage
    rec
    board
    inbox
    system
    app_modules
    efont_cn12
; prog_name.py: `pio run` builds .pio/build/sim/cpa-sim (tests stay .pio/build/sim/program).
extra_scripts =
    pre:lib/efont_cn12/gen_font.py
    pre:prog_name.py
; CPA_TEST_HOOKS=1: the same runtime as the HIL build (debug.key / debug.state).
; -I: the fakes (test/ui/support, test/core/support), module_list.h, and the
; usb_transport headers (line_queue.h and the ring sizes; its .cpp is device only).
build_flags =
    -std=c++17 -Wall -Wextra -Werror
    -DCPA_TEST_HOOKS=1
    -DARDUINOJSON_USE_LONG_LONG=1
    -I../app/test
    -I../app/test/ui
    -I../app/src
    -I../app/lib/usb_transport
