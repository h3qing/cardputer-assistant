# CD: on a version tag, build the release firmware and publish a GitHub Release.
# Release notes come from docs/releases/<tag>.md (required, so every release is documented).
# Since v0.5.0 it also publishes the Mac side scripts/install.sh reads (docs/27): the cpad wheel, the pyserial
# wheel pinned by daemon/uv.lock, install.sh, uninstall.sh and one SHA256SUMS over everything. The Mac app zip
# needs a macOS machine: scripts/release-local.sh --tag <tag> --publish adds it and replaces SHA256SUMS.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  UV_VERSION: "0.11.16"

jobs:
  firmware:
    name: build firmware and publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-release-${{ runner.os }}-${{ hashFiles('firmware/app/platformio.ini') }}
      - name: Install PlatformIO
        run: uv tool install platformio==6.2.0
      - name: Release notes exist
        run: test -s "docs/releases/${GITHUB_REF_NAME}.md"
      - name: The daemon's version is the tag's (uv version X.Y.Z --project daemon; #57)
        run: test "$(uv version --short --project daemon)" = "${GITHUB_REF_NAME#v}"
      - name: Build release firmware (no test hooks)
        working-directory: firmware/app
        run: |
          pio run -e cardputer-adv
          python3 scripts/check_budget.py .pio/build/cardputer-adv
          if grep -a -q -E 'debug\.(key|state|reboot|rec|mic|codec|lang)' .pio/build/cardputer-adv/firmware.bin; then exit 1; fi
      # cpa-<tag>.bin (merged: full flash at 0x0, or the Launcher, which shows it as
      # cpa-<tag>), cpa-<tag>-app.bin (0x10000) and SHA256SUMS (docs/09-m2-design.md §4.4).
      # make_image.py checks the partition table first (scripts/check_partitions.py).
      - name: Package images
        working-directory: firmware/app
        run: |
          set -euo pipefail
          python3 scripts/check_partitions.py .pio/build/cardputer-adv/partitions.bin
          python3 scripts/make_image.py --env cardputer-adv --tag "$GITHUB_REF_NAME" --out "$GITHUB_WORKSPACE/dist"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum -c SHA256SUMS && cat SHA256SUMS)
      - name: Mac side (wheels, scripts) and one SHA256SUMS
        run: |
          set -euo pipefail
          uv build --project daemon --wheel --out-dir dist
          url="$(awk '/^name = "pyserial"/{p=1} p && /py2.py3-none-any.whl/{match($0,/https:[^"]+/); print substr($0,RSTART,RLENGTH); exit}' daemon/uv.lock)"
          want="$(awk '/^name = "pyserial"/{p=1} p && /py2.py3-none-any.whl/{match($0,/sha256:[0-9a-f]+/); print substr($0,RSTART+7,RLENGTH-7); exit}' daemon/uv.lock)"
          curl -fsSL -o dist/pyserial-3.5-py2.py3-none-any.whl "$url"
          echo "$want  dist/pyserial-3.5-py2.py3-none-any.whl" | sha256sum -c
          cp scripts/install.sh scripts/uninstall.sh dist/
          (cd dist && rm SHA256SUMS && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --verify-tag
